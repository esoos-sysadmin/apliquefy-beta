<svg xmlns="http://www.w3.org/2000/svg" width="603" height="150" viewBox="0 0 603 150" role="img" aria-labelledby="title desc"><title id="title">Etiquetas de status</title><desc id="desc">Cinco status com texto, ponto e superfícies semânticas.</desc><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="36" fill="#14121C" font-size="20" font-weight="600" text-anchor="start">Status de candidaturas</text><rect x="24" y="66" width="91" height="26" rx="6" fill="#EAF8EF"/><circle cx="35" cy="79" r="2.5" fill="#08773A"/><text x="44" y="83" fill="#08773A" font-size="11" font-weight="600" text-anchor="start">Enviada</text><rect x="127" y="66" width="107" height="26" rx="6" fill="#F0E9FF"/><circle cx="138" cy="79" r="2.5" fill="#5420BF"/><text x="147" y="83" fill="#5420BF" font-size="11" font-weight="600" text-anchor="start">Em análise</text><rect x="246" y="66" width="94" height="26" rx="6" fill="#FFF2E6"/><circle cx="257" cy="79" r="2.5" fill="#A64500"/><text x="266" y="83" fill="#A64500" font-size="11" font-weight="600" text-anchor="start">A revisar</text><rect x="352" y="66" width="94" height="26" rx="6" fill="#F6F4FA"/><circle cx="363" cy="79" r="2.5" fill="#625D6C"/><text x="372" y="83" fill="#625D6C" font-size="11" font-weight="600" text-anchor="start">Pausada</text><rect x="458" y="66" width="121" height="26" rx="6" fill="#FFF0EE"/><circle cx="469" cy="79" r="2.5" fill="#B42318"/><text x="478" y="83" fill="#B42318" font-size="11" font-weight="600" text-anchor="start">Não enviada</text><text x="24" y="127" fill="#625D6C" font-size="12" font-weight="400" text-anchor="start">A cor complementa o texto; nunca substitui a informação.</text></g></svg>