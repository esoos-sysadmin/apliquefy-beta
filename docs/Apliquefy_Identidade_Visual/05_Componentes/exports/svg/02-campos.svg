<svg xmlns="http://www.w3.org/2000/svg" width="734" height="328" viewBox="0 0 734 328" role="img" aria-labelledby="title desc"><title id="title">Campos e estados</title><desc id="desc">Campos com rótulos permanentes e estados padrão, foco, erro e desabilitado.</desc><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="36" fill="#14121C" font-size="20" font-weight="600" text-anchor="start">Campos de formulário</text><text x="24" y="83" fill="#14121C" font-size="13" font-weight="600" text-anchor="start">Que trabalho você procura?</text><rect x="24" y="97" width="326" height="44" rx="10" fill="white" stroke="#D8D4E2" stroke-width="1"/><text x="36" y="124" fill="#14121C" font-size="14" font-weight="400" text-anchor="start">Atendente</text><text x="24" y="161" fill="#625D6C" font-size="11" font-weight="400" text-anchor="start">Você pode procurar por função ou área.</text><text x="384" y="83" fill="#14121C" font-size="13" font-weight="600" text-anchor="start">Onde você quer trabalhar?</text><rect x="380" y="93" width="334" height="52" rx="14" fill="none" stroke="#5420BF" stroke-width="2"/><rect x="384" y="97" width="326" height="44" rx="10" fill="white" stroke="#7A3BFF" stroke-width="1"/><text x="396" y="124" fill="#14121C" font-size="14" font-weight="400" text-anchor="start">Recife, PE</text><text x="384" y="161" fill="#625D6C" font-size="11" font-weight="400" text-anchor="start">Exemplo visual do estado de foco.</text><text x="24" y="218" fill="#14121C" font-size="13" font-weight="600" text-anchor="start">E-mail</text><rect x="24" y="232" width="326" height="44" rx="10" fill="white" stroke="#B42318" stroke-width="1"/><text x="36" y="259" fill="#14121C" font-size="14" font-weight="400" text-anchor="start">ana@</text><text x="24" y="296" fill="#B42318" font-size="11" font-weight="400" text-anchor="start">Digite um e-mail completo para continuar.</text><text x="384" y="218" fill="#14121C" font-size="13" font-weight="600" text-anchor="start">País</text><rect x="384" y="232" width="326" height="44" rx="10" fill="#ECE9F1" stroke="#D8D4E2" stroke-width="1"/><text x="396" y="259" fill="#756F80" font-size="14" font-weight="400" text-anchor="start">Brasil</text><text x="384" y="296" fill="#625D6C" font-size="11" font-weight="400" text-anchor="start">Não representa cobertura disponível.</text></g></svg>