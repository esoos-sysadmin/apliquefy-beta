<svg xmlns="http://www.w3.org/2000/svg" width="480" height="149" viewBox="0 0 480 149" role="img" aria-labelledby="title desc"><title id="title">Informação complementar</title><desc id="desc">Disclosure aberto com resposta clara sobre a demonstração.</desc><g font-family="Arial, Liberation Sans, sans-serif"><rect x="1" y="1" width="478" height="147" rx="10" fill="white" stroke="#D8D4E2" stroke-width="1"/><text x="19" y="32" fill="#14121C" font-size="13" font-weight="600" text-anchor="start">O que acontece com os dados deste exemplo?</text><g transform="translate(439 16) scale(0.8333333333333334)" fill="none" stroke="#625D6C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5.8 14.8 6.2-6.2 6.2 6.2"/></g><text x="19" y="70" fill="#625D6C" font-size="13" font-weight="400" text-anchor="start">Ficam apenas na memória desta página. O catálogo</text><text x="19" y="92" fill="#625D6C" font-size="13" font-weight="400" text-anchor="start">não envia candidaturas, não acessa serviços externos</text><text x="19" y="114" fill="#625D6C" font-size="13" font-weight="400" text-anchor="start">e não salva dados após recarregar.</text></g></svg>