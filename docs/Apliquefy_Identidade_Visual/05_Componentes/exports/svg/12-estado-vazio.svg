<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" role="img" aria-labelledby="title desc"><title id="title">Estado vazio</title><desc id="desc">Estado vazio com ação útil e texto de orientação.</desc><g font-family="Arial, Liberation Sans, sans-serif"><rect x="1" y="1" width="438" height="238" rx="16" fill="white" stroke="#D8D4E2" stroke-width="1"/><g transform="translate(204 29) scale(1.3333333333333333)" fill="none" stroke="#625D6C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.4"/><path d="m15.1 15.1 5.1 5.1"/></g><text x="220" y="102" fill="#14121C" font-size="16" font-weight="600" text-anchor="middle">Nenhuma vaga encontrada.</text><text x="220" y="132" fill="#625D6C" font-size="13" font-weight="400" text-anchor="middle">Experimente outra função ou amplie a região</text><text x="220" y="151" fill="#625D6C" font-size="13" font-weight="400" text-anchor="middle">da sua busca.</text><rect x="143" y="174" width="154" height="44" rx="10" fill="white" stroke="#D8D4E2" stroke-width="1"/><text x="220.0" y="201" fill="#14121C" font-size="14" font-weight="600" text-anchor="middle">Ajustar busca</text></g></svg>