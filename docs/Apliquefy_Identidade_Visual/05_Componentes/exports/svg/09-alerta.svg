<svg xmlns="http://www.w3.org/2000/svg" width="620" height="115" viewBox="0 0 620 115" role="img" aria-labelledby="title desc"><title id="title">Alerta informativo</title><desc id="desc">Mensagem informativa com ícone, título e orientação clara.</desc><g font-family="Arial, Liberation Sans, sans-serif"><rect x="1" y="1" width="618" height="113" rx="10" fill="#F8F4FF" stroke="#DBCEF4" stroke-width="1"/><g transform="translate(19 20) scale(0.8333333333333334)" fill="none" stroke="#5420BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 10.8v6M12 7.2v.1"/></g><text x="51" y="33" fill="#14121C" font-size="14" font-weight="600" text-anchor="start">Você define sua busca.</text><text x="51" y="58" fill="#625D6C" font-size="13" font-weight="400" text-anchor="start">Escolha as áreas, a região e os horários que fazem sentido.</text><text x="51" y="80" fill="#625D6C" font-size="13" font-weight="400" text-anchor="start">Revise suas preferências sempre que precisar.</text></g></svg>