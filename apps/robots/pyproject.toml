[project]
name = "rpa-engine"
version = "0.1.0"
description = "Apliquefy RPA Engine — FastAPI + Playwright + Anthropic Vision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.49",
    "pydantic>=2.9",
    "httpx>=0.27",
    "websockets>=13",
    "browser-use>=0.13,<0.14",
    "sentry-sdk>=2.20",
]

[project.scripts]
rpa-engine = "rpa_engine.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7",
    "pyinstaller>=6.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
